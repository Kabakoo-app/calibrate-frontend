name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/kabakoo-app/calibrate-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* values are baked into the client bundle at build
          # time by Next.js, so they must be set as repo variables/secrets
          # before this workflow will produce a working image. Everything
          # else (AUTH_SECRET, GOOGLE_CLIENT_*, etc.) is runtime-only and
          # comes from the .env file already on the instance.
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      GHCR_ACTOR: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          COMMANDS=$(jq -n --arg actor "$GHCR_ACTOR" --arg token "$GHCR_TOKEN" '[
            "cd /var/www/calibrate/frontend",
            "git pull",
            ("echo " + ($token | @sh) + " | docker login ghcr.io -u " + ($actor | @sh) + " --password-stdin"),
            "docker pull ghcr.io/kabakoo-app/calibrate-frontend:latest",
            "IMAGE_NAME=ghcr.io/kabakoo-app/calibrate-frontend IMAGE_TAG=latest CONTAINER_NAME=calibrate-frontend PORT=3000 docker compose -p calibrate-frontend up -d --force-recreate",
            "docker image prune -f",
            "docker logout ghcr.io"
          ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy calibrate-frontend ${{ github.sha }}" \
            --parameters "{\"commands\":$COMMANDS}" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed: $STATUS"
            exit 1
          fi
